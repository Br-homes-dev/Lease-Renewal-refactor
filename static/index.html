<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lease Adjustment Panel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
    }
    #result p {
      margin: 0.3em 0;
    }
    fieldset {
      margin-top: 1em;
      padding: 1em;
      border: 1px solid #ccc;
    }
    .inline {
      display: inline-block;
      margin-right: 1em;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2em auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <h2>Lease Adjustment Panel</h2>

  <div class="container" id="result">
  <h1>Lease Adjustment Panel</h1>
  <div id="loading">
    <div class="spinner"></div>
    <p style="text-align:center;">Loading lease data...</p>
  </div>
</div>


  <script src="/rent-preview.js"></script>
</body>
</html>
